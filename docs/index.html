<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation - Microservices</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .topbar {
            background-color: #1b1b1b;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .service-selector {
            padding: 20px;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }
        .service-selector button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .service-selector button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🏠 Warmhouse Microservices API</h1>
        <p>Документация микросервисов</p>
    </div>
    <div class="service-selector">
        <button onclick="loadSpec('user-service')">👤 User Service</button>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script>
        let ui;

        const links = {
            'user-service': 'https://raw.githubusercontent.com/AndKiRiLL/architecture-pro-warmhouse/warmhouse/openapi/user-service.yaml'
        }
        
        function loadSpec(specFile) {
            const url = links[specFile];
            console.log('Загрузка:', url);
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(yaml => {
                    console.log('YAML загружен, длина:', yaml.length);
                    
                    // Проверяем, что YAML валидный
                    try {
                        // Простая проверка - ищем openapi версию
                        if (!yaml.includes('openapi:')) {
                            throw new Error('Файл не содержит openapi:');
                        }
                    } catch(e) {
                        console.warn(e);
                    }
                    
                    // Пересоздаём UI
                    const uiConfig = {
                        spec: yaml,
                        dom_id: '#swagger-ui',
                        presets: [SwaggerUIBundle.presets.apis],
                        layout: "BaseLayout",
                        deepLinking: true,
                        docExpansion: "list"
                    };
                    
                    if (ui) {
                        ui = SwaggerUIBundle(uiConfig);
                    } else {
                        ui = SwaggerUIBundle(uiConfig);
                    }
                })
                .catch(error => {
                    console.error('Error loading spec:', error);
                    document.getElementById('swagger-ui').innerHTML = 
                        '<div style="padding: 20px; color: red; background: #ffebee; margin: 20px; border-radius: 5px;">' +
                        '❌ Ошибка загрузки спецификации:<br>' +
                        error.message + '<br><br>' +
                        'Проверьте URL: ' + links['user-service'] + '<br>' +
                        'Убедитесь, что YAML файл содержит корректный OpenAPI 3.0</div>';
                });
        }
        
        // Загружаем сервис
        loadSpec('user-service');
    </script>
</body>
</html>
