<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Warmhouse Microservices API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .warmhouse-header {
            background: #1b1b1b;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .warmhouse-header h1 {
            margin: 0;
            font-size: 24px;
        }
        .warmhouse-header p {
            margin: 5px 0 0;
            opacity: 0.8;
        }
        .warmhouse-selector-container {
            background: #f5f5f5;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .warmhouse-selector-container label {
            font-weight: bold;
            margin-right: 10px;
        }
        .warmhouse-selector-container select {
            padding: 8px 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            background: white;
        }
        .warmhouse-selector-container select:hover {
            border-color: #007bff;
        }
        .warmhouse-loading {
            padding: 40px;
            color: #666;
        }
        .warmhouse-error {
            padding: 20px;
            margin: 20px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            border-radius: 4px;
        }
        .warmhouse-info {
            padding: 10px;
            background: #e3f2fd;
            color: #0d47a1;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="warmhouse-header">
        <h1>🏠 Warmhouse Microservices API</h1>
        <p>Документация API сервисов умного дома</p>
    </div>
    
    <div class="warmhouse-selector-container">
        <label for="api-select">Выберите микросервис:</label>
        <select id="api-select">
            <option value="user-service-api.json">User & Home Service</option>
            <option value="device-and-scenario-service-api.json">Device & Scenario Service</option>
        </select>
    </div>
    
    <div id="swagger-ui" class="warmhouse-loading">⏳ Загрузка документации...</div>
    <div class="warmhouse-info">
        💡 Документация в формате OpenAPI 3.0. Выберите микросервис из списка
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        let currentUI = null;
        const baseUrl = 'https://raw.githubusercontent.com/AndKiRiLL/architecture-pro-warmhouse/warmhouse/openapi/';
        
        function loadAPI(apiFile) {
            const url = baseUrl + apiFile;
            const container = document.getElementById('swagger-ui');
            container.innerHTML = '<div class="loading">⏳ Загрузка ' + apiFile + '...</div>';
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(spec => {
                    if (currentUI) {
                        // Обновляем существующий UI
                         currentUI = SwaggerUIBundle({
                            spec: spec,
                            dom_id: '#swagger-ui',
                            presets: [SwaggerUIBundle.presets.apis],
                            layout: 'BaseLayout',
                            docExpansion: 'list',
                            defaultModelsExpandDepth: 1
                        });
                    } else {
                        // Создаём новый UI
                        currentUI = SwaggerUIBundle({
                            spec: spec,
                            dom_id: '#swagger-ui',
                            presets: [SwaggerUIBundle.presets.apis],
                            layout: 'BaseLayout',
                            docExpansion: 'list',
                            defaultModelsExpandDepth: 1
                        });
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    container.innerHTML = `
                        <div class="error">
                            <strong>❌ Ошибка загрузки API документации</strong><br>
                            ${error.message}<br><br>
                            <strong>Файл:</strong> ${apiFile}<br>
                            <strong>URL:</strong> ${url}<br><br>
                            <a href="${url}" target="_blank" style="color: #007bff;">Открыть JSON файл напрямую</a>
                        </div>
                    `;
                });
        }
        
        // Обработчик смены сервиса
        document.getElementById('api-select').addEventListener('change', function(e) {
            loadAPI(e.target.value);
        });
        
        // Загружаем первый сервис
        loadAPI('user-service-api.json');
    </script>
</body>
</html>
